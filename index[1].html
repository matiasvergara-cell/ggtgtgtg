const defaults=()=>({role:'home',title:'Mi proyecto energético',house:'Mi casa',months:Array(12).fill(true),days:30,absence:1,connection:'grid',goal:'saving',location:'',lat:-40.4,lon:-71.3,resource:null,resourceMode:'demo',source:'Ejemplo didáctico, no representa mediciones de la vivienda',ghi:[6.5,5.7,4.5,3.1,2,1.5,1.7,2.5,3.7,4.9,5.8,6.6],wind:Array(12).fill(4),diffuse:Array(12).fill(null),placement:'roof',roof:'Chapa',area:40,tilt:35,azimuth:0,ideal:true,shade:10,shadeChoice:'unknown',terrain:'open',trees:10,treeDistance:20,energyMode:'bill',monthly:300,monthlyValues:Array(12).fill(300),monthlyCustom:false,habit:'evening',peak:3,exchange:0,exchangeDate:new Date().toISOString().slice(0,10),tariff:0.15,tariffARS:0,fixed:0,exportEnabled:false,exportTariff:0,technology:'solar',sizing:'recommend',panelPower:550,panelArea:2.6,panelPrice:140,panels:6,inverter:3,losses:20,turbinePower:1500,turbinePrice:1500,turbines:1,hub:18,measureHeight:10,shear:0.14,cutin:3,rated:12,cutout:25,windLoss:20,battery:'none',batterySize:10.24,batteryUnit:5.12,batteryUnitPrice:1000,dod:80,batteryEff:90,batteryPower:3,voltage:51.2,autonomy:1,essential:60,generator:false,genPower:4,genLoad:70,genFuel:'diesel',fuelRate:1.2,fuelPrice:1.2,genUse:'both',genCharge:2,genMax:24,costInverter:700,costStructure:300,costProtection:200,costCable:150,costController:0,costLabor:500,costTransport:100,costPermits:0,costTower:900,costGen:0,maintenance:1,years:20,discount:5,degradation:0.5,batteryLife:10,inverterLife:12,emissions:0,unknown:{shade:true,losses:true,peak:true,tariff:true,discount:true,degradation:true,maintenance:true,monthly:true,absence:true},appliances:[{name:'Heladera (promedio de ciclo)',watts:60,qty:1,hours:24},{name:'Luces LED',watts:10,qty:6,hours:5},{name:'Televisor',watts:80,qty:1,hours:4}]});
let d=defaults(), step=0, result=null, geoResults=[], busy=false;
const HELP={
months:['Meses de uso','Elegí cuándo ocupás la vivienda. Después indicá cuántos días por mes y qué queda consumiendo al salir. Esto cambia la demanda y el objetivo de inclinación. No supone que la casa apagada consume cero.'],
exchange:['Cotización del dólar','Ingresá cuántos pesos argentinos equivalen a US$1 según la cotización que uses para presupuestar. Ejemplo: 1500 significa US$1 = ARS 1500. No se actualiza sola. Se guarda la fecha y cotización de cada simulación. Dejá 0 si no necesitás equivalencias en pesos.'],
tariff:['Precio de cada kWh','Es el cargo variable por energía que evitás comprar. Buscalo en la factura o cuadro tarifario de tu distribuidora. No dividas sin más el total de la factura por los kWh: mezclarías cargos fijos e impuestos. Si no sabés, usamos 0,15 USD/kWh como supuesto ilustrativo, no como tarifa argentina vigente.'],
fixed:['Cargo fijo mensual','Es el importe que se paga por estar conectado, aunque no consumas. Buscá “cargo fijo” en la factura. Si corresponde a dos meses, convertí al equivalente mensual. No se cuenta como ahorro solar. Si no lo sabés, 0 significa que no se incluye al mostrar gastos, no que desaparece.'],
losses:['Pérdidas sin sombras','Parte de la energía teórica que se pierde por temperatura, suciedad, cables, inversor y otros efectos. El supuesto inicial de 20% es educativo. Un técnico puede estimarlo con el clima, mantenimiento y fichas de equipos. Las sombras se aplican aparte, una sola vez.'],
shade:['Pérdida por sombras','Parte de la producción que se pierde por árboles, montañas, chimeneas u obstáculos. Para conocerla se estudian sombras en distintos horarios y estaciones. Las opciones visuales son supuestos, no mediciones: sin obstáculos 0%, algunas sombras 10%, frecuentes 25%. “No sé” usa 10% y queda marcado.'],
habit:['Cuándo usás la energía','Usamos un perfil horario sintético para repartir tu consumo. Solar de día se usa directamente; de noche hace falta batería, red o generador. No pedimos un porcentaje de autoconsumo: lo calcula el balance horario aproximado. Para mayor precisión se necesita consumo medido hora a hora.'],
discount:['Tasa de descuento real','Permite comparar dinero invertido hoy con ahorros futuros. “Real” significa sin inflación. Con 5%, un ahorro de US$105 dentro de un año equivale a US$100 hoy. No es un gasto ni una pérdida del panel. Se elige según el criterio económico; 5% es un escenario editable, no una rentabilidad garantizada.'],
degradation:['Degradación del panel','Reducción gradual de la producción con los años. Buscá la garantía de potencia del fabricante. Con 0,5% anual, el segundo año produce aproximadamente 99,5% del primero, manteniendo el resto igual. Aquí se usa una tasa constante; no modela una caída especial del primer año.'],
emissions:['Factor de emisiones de la red','Kg de CO₂ asociados a cada kWh de red. Buscalo en una publicación oficial indicando año y metodología. No hay un valor universal. Dejamos 0 y omitimos el resultado hasta que ingreses uno documentado. No calculamos emisiones del grupo ni ciclo de vida.'],
battery:['Banco de baterías','La capacidad nominal es toda la energía del banco. La utilizable es menor por la profundidad de descarga y las pérdidas. Recomendamos kWh nominales a partir del consumo esencial y días de autonomía. Es una reserva teórica: no garantiza atravesar secuencias de días nublados. Verificá compatibilidad, corriente y temperatura con las fichas.'],
autonomy:['Días de autonomía','Cuántos días querés cubrir el consumo esencial sin generación. Se usa para sugerir el banco. Un día de reserva no significa que la producción solar alcance para recargarlo. Los resultados muestran faltantes.'],
essential:['Consumos esenciales','Porcentaje del consumo diario que querés respaldar al dimensionar el banco. Ejemplo: luces, heladera y comunicaciones, sin calefacción. El balance energético sigue evaluando toda la casa; este porcentaje solo define el tamaño recomendado de reserva.'],
peak:['Potencia simultánea','Suma de las potencias de los aparatos que pueden funcionar juntos. Mirá sus etiquetas. Una bomba o heladera puede pedir más al arrancar. El supuesto 3 kW no verifica esos arranques. Este dato sirve para advertir sobre inversor, batería o grupo insuficientes.'],
fuelRate:['Consumo del grupo','Litros, kg o m³ por hora a la carga de trabajo elegida. Sale del manual o de medir combustible y horas. No uses el consumo a máxima carga si trabajarás al 50%. La referencia de 1,2 L/h es ilustrativa y puede ser muy distinta en tu grupo. Se aproxima consumo proporcional al tiempo de marcha.'],
genLoad:['Carga del generador','Porcentaje de potencia nominal al que suponemos que trabaja. Un grupo de 4 kW al 70% entrega 2,8 kW. No es su rendimiento energético. El combustible debe corresponder a esa carga.'],
genUse:['Uso del generador','Directo: funciona cuando falta energía y atiende la carga. Carga de banco: repone energía mediante cargador. Ambos: atiende la casa y aprovecha potencia sobrante para cargar. Los tiempos son equivalentes aproximados, sin modelar arranques, calentamiento ni ciclos mínimos.'],
area:['Superficie disponible','En techo, ingresá área neta libre, descontando obstáculos y accesos. En suelo, el modelo reserva dos veces el área de módulos para separación y acceso: es una regla orientativa, no un plano de filas ni cálculo de sombras entre ellas.'],
ideal:['Disposición sugerida','Exploramos inclinaciones de 0 a 70° en pasos de 5°, orientadas al ecuador (norte en Argentina). Elegimos según meses de uso y objetivo. El cálculo usa un día solar representativo de cada mes: no considera el horizonte real, nieve ni sombras entre filas.'],
resource:['Recurso solar y viento','NASA POWER entrega promedios climáticos por coordenadas, no una estación en tu terreno. Consultamos radiación horizontal, difusa y viento a 10 m. La app transpone el recurso solar a la inclinación elegida. Podés ingresar 12 valores propios con fuente. El ejemplo incorporado es inventado y nunca se presenta como dato local.'],
terrain:['Entorno eólico','Árboles y edificios producen turbulencia y resguardo. La categoría genera advertencias; no inventa un descuento preciso. Altura y distancia de árboles se documentan para revisión. Un atlas o viento regional no reemplaza mediciones a la altura del rotor.'],
wind:['Velocidad del viento','Promedio mensual en m/s a una altura declarada. Lo obtenés de mediciones o de una base meteorológica. El modelo usa una distribución Rayleigh y una curva genérica; la velocidad media por sí sola no determina una producción real.'],
shear:['Exponente de altura','Se usa v₂ = v₁ × (h₂/h₁)^α. El valor 0,14 es solo una referencia. Bosques y entornos complejos no se describen bien con un único exponente. Conviene medir a la altura de buje.'],
cost:['Costo orientativo en USD','Los valores iniciales son ejemplos editables, no cotizaciones actuales. Pedí un presupuesto e ingresá cada componente por separado. Paneles, baterías y turbinas se suman automáticamente; no vuelvas a incluirlos en otros rubros.'],
maintenance:['Mantenimiento anual','Porcentaje de la inversión renovable que reservás por año para revisiones y mantenimiento. 1% es un supuesto didáctico. El combustible se suma aparte. Las reposiciones de batería e inversor se incluyen según la vida declarada.'],
exportTariff:['Compensación por excedentes','Importe recibido por kWh entregado a red. No suele coincidir con lo que pagás por comprar energía. Ingresalo solo si tu instalación puede inyectar y conocés el esquema aplicable. Sin habilitación, los excedentes no se valorizan.'],

function annual(x,s,factor=1,baseline=false){let rows=M.map((_,m)=>{let v=dispatch(x,s,m,factor,baseline);return {...v,month:M[m],days:DAYS[m],energy:v.demand*DAYS[m],generation:(v.solar+v.wind)*DAYS[m],gridEnergy:v.grid*DAYS[m],missing:v.unserved*DAYS[m],fuelTotal:v.fuel*DAYS[m],hoursTotal:v.genHours*DAYS[m],genEnergy:v.gen*DAYS[m],exportEnergy:v.exported*DAYS[m],used:v.usedRenewable*DAYS[m]}});const total=k=>sum(rows.map(v=>v[k]));return {rows,demand:total('energy'),generation:total('generation'),grid:total('gridEnergy'),missing:total('missing'),fuel:total('fuelTotal'),hours:total('hoursTotal'),gen:total('genEnergy'),exported:total('exportEnergy'),used:total('used'),cost:total('gridEnergy')*x.tariff+total('fuelTotal')*x.fuelPrice-total('exportEnergy')*x.exportTariff+(x.connection==='grid'?x.fixed*12:0)}}
function calculate(input){let x=clone(input);validate(x);let s=setup(x),a=annual(x,s),base=annual(x,s,1,true);let panelCost=s.panels*x.panelPrice,turbineCost=x.technology==='solar'?0:x.turbines*x.turbinePrice,batteryCost=s.bankUnits*x.batteryUnitPrice;const items=[['Paneles solares',panelCost],['Aerogeneradores',turbineCost],['Banco de baterías',batteryCost],['Inversor',x.costInverter],['Estructura',x.technology==='wind'?0:x.costStructure],['Protecciones',x.costProtection],['Cableado',x.costCable],['Controlador',x.costController],['Mano de obra',x.costLabor],['Transporte',x.costTransport],['Trámites',x.costPermits],['Torre y cimentación',x.technology==='solar'?0:x.costTower],['Grupo electrógeno',x.generator?x.costGen:0]];let capex=sum(items.map(a=>a[1])),maint=(capex-(x.generator?x.costGen:0))*x.maintenance/100;let annualSaving=base.cost-a.cost-maint;let cumulative=-capex,npv=-capex,payback=null,flows=[];let comparable=base.missing<.01&&a.missing<.01;for(let y=1;y<=Math.floor(x.years);y++){let ay=y===1?a:annual(x,s,Math.pow(1-x.degradation/100,y-1)),replacement=(s.bank&&y%x.batteryLife===0?batteryCost:0)+(y%x.inverterLife===0?x.costInverter:0),cash=base.cost-ay.cost-maint-replacement,prev=cumulative;cumulative+=cash;npv+=cash/Math.pow(1+x.discount/100,y);if(payback===null&&prev<0&&cumulative>=0)payback=y-1+(-prev/cash);flows.push({year:y,saving:cash,replacement,cumulative});if(ay.missing>.01)comparable=false}let warnings=[];if(x.resourceMode==='stale')warnings.push('La ubicación cambió después de cargar el clima: consultá nuevamente el recurso. Los datos actuales corresponden al punto anterior.');if(x.resourceMode==='demo')warnings.push('Recurso climático de ejemplo: estos resultados no describen tu ubicación hasta cargar NASA POWER o valores documentados.');if(x.resourceMode==='manual')warnings.push('Radiación manual: verificá que sea horizontal y que fuente, período y coordenadas correspondan.');if(s.panels<s.recommendedPanels&&x.sizing==='recommend'&&x.technology!=='wind')warnings.push('El espacio limita la cantidad sugerida de paneles.');if(x.technology!=='solar')warnings.push('Eólica: curva genérica y promedio horario constante. Puede sobreestimar la regularidad del suministro y subestimar baterías o grupo. Requiere mediciones y curva certificada.');if(x.technology!=='solar'&&x.terrain!=='open')warnings.push('El entorno con obstáculos necesita evaluación de turbulencia. No aplicamos una corrección arbitraria por árboles o edificios.');if(a.missing>.01)warnings.push('Queda demanda sin cubrir. Revisá generación, banco, potencia y horario del grupo.');if(x.battery==='none'&&x.connection==='offgrid')warnings.push('Sin banco ni red: confirmar que el inversor soporte esa operación. La generación no garantiza abastecimiento continuo.');if(x.peak>x.inverter)warnings.push('La potencia simultánea declarada supera la del inversor. El balance de energía no verifica arranques ni entrega instantánea.');if(x.generator&&x.peak>x.genPower*x.genLoad/100)warnings.push('El grupo a la carga declarada no alcanza la potencia simultánea máxima.');if(s.bank&&x.peak>x.batteryPower)warnings.push('La potencia declarada del banco no cubre todos los consumos simultáneos.');if(!comparable)warnings.push('No se presenta recuperación ni VAN: los escenarios no aseguran el mismo servicio energético o falta una fuente de suministro de referencia.');if(x.connection==='offgrid'&&!x.generator)warnings.push('Sin red ni grupo de referencia, se muestra inversión y cobertura, no ahorro monetario inventado.');if(x.generator)warnings.push('Combustible aproximado: curva de consumo plana a la carga elegida, sin ralentí, arranques ni servicio del grupo. Horas equivalentes medias, no un cronograma real.');return {id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),version:VERSION,date:new Date().toISOString(),x,s,a,base,capex,items,maint,annualSaving,flows,npv,payback,comparable,warnings}}
function chart(rows){const max=Math.max(1,...rows.flatMap(r=>[r.energy,r.generation]));return `<div class="legend"><span><i style="background:#347859"></i>Generación renovable</span><span><i style="background:#c7dc92"></i>Consumo</span></div><div class="chart" role="img" aria-label="Generación renovable y consumo mensual; valores exactos en la tabla inferior">${rows.map(r=>`<div class="chartgroup"><div class="bars"><div class="bar" style="height:${r.generation/max*100}%;background:#347859" title="${r.month}: ${fmt(r.generation)} kWh generados"></div><div class="bar" style="height:${r.energy/max*100}%;background:#c7dc92" title="${r.month}: ${fmt(r.energy)} kWh consumidos"></div></div><small>${r.month}</small></div>`).join('')}</div>`}
function results(){let r=result,{x,s,a}=r;return `<div class="resulthead"><div><span class="eyebrow">Tu escenario · ${new Date(r.date).toLocaleDateString('es-AR')}</span><h1>${esc(x.title)}</h1><p class="muted">${esc(x.house)} · ${esc(x.location||'Ubicación por coordenadas')} · ${x.connection==='grid'?'Con red eléctrica':'Casa aislada'}</p></div><div class="actions noprint"><button class="btn secondary" data-action="edit">Editar</button><button class="btn" data-action="save">Guardar escenario</button></div></div><div class="grid spaced"><article class="card"><span class="eyebrow">Inversión estimada</span><div class="metric">${usd(r.capex)}</div><small>${x.exchange>0?'ARS '+fmt(r.capex*x.exchange)+' · cotización '+esc(x.exchangeDate):'Costos orientativos · precios constantes'}</small></article><article class="card"><span class="eyebrow">Generación anual</span><div class="metric">${fmt(a.generation)} <small style="display:inline">kWh</small></div><small>${fmt(a.demand)} kWh de demanda anual</small></article><article class="card"><span class="eyebrow">${r.comparable?'Ahorro neto · primer año':'Demanda sin cubrir'}</span><div class="metric">${r.comparable?usd(r.annualSaving):fmt(a.missing)+' <small style="display:inline">kWh/año</small>'}</div><small>${r.comparable?'Incluye combustible y mantenimiento':a.missing>.01?'Revisá las alertas antes de decidir':'Sin referencia económica comparable'}</small></article></div><div class="split spaced"><section class="card"><h2>Tu energía, mes a mes.</h2><p class="muted">Generar de sobra en verano no asegura cubrir una noche de invierno.</p>${chart(a.rows)}</section><section class="card"><span class="badge">Configuración evaluada</span><h2 class="spaced">${s.panels} paneles${x.technology!=='solar'?' + '+x.turbines+' turbina(s)':''}</h2><p>${fmt(s.panels*x.panelPower/1000,2)} kWp solar · ${fmt(x.inverter,1)} kW de inversor</p><p>${x.placement==='ground'?'En suelo':'En techo'} · inclinación ${s.tilt}° · azimut ${s.azimuth}°</p><p>${s.bank?`${fmt(s.bank,2)} kWh nominales de banco<br><small>${fmt(s.bank*x.dod/100,2)} kWh utilizables antes de pérdidas · ${fmt(s.bank*1000/x.voltage)} Ah a ${x.voltage} V<br>${s.bankUnits} módulos equivalentes de ${x.batteryUnit} kWh</small>`:'Sin banco de baterías'}</p><small>${x.ideal?'Inclinación sugerida por modelo simplificado.':'Disposición ingresada por el usuario.'} Verificar montaje y compatibilidad.</small></section></div><div class="grid spaced"><article class="card"><h3>Energía de la red</h3><div class="metric">${fmt(a.grid)} <small style="display:inline">kWh/año</small></div><small>${fmt(a.exported)} kWh/año de excedentes valorizados</small></article><article class="card"><h3>Recuperación simple</h3><div class="metric">${r.comparable?(r.payback!==null?fmt(r.payback,1)+' años':'No recupera'):'No evaluable'}</div><small>${r.comparable?'Primera recuperación; revisar reposiciones posteriores.':'Se necesita suministro comparable en ambos casos.'}</small></article><article class="card"><h3>Valor actual neto</h3><div class="metric">${r.comparable?usd(r.npv):'—'}</div><small>${x.years} años · tasa real ${x.discount}% · supuestos constantes</small></article></div>${x.generator?block('El grupo, como apoyo',`<div class="grid"><div><span class="eyebrow">Funcionamiento anual</span><div class="metric">${fmt(a.hours)} h</div></div><div><span class="eyebrow">Combustible anual</span><div class="metric">${fmt(a.fuel,1)} ${fuelUnit(x)}</div></div><div><span class="eyebrow">Gasto en combustible</span><div class="metric">${usd(a.fuel*x.fuelPrice)}</div></div></div><p class="muted">Grupo de ${x.genPower} kW a ${x.genLoad}% de carga. Referencia sin renovables: ${fmt(r.base.fuel)} ${fuelUnit(x)}/año. Los tiempos diarios son promedios de todos los días del mes, incluidas ausencias.</p>`):''}${block('Detalle mensual',`<div class="scroll"><table><thead><tr><th>Mes</th><th>Consumo<br>kWh</th><th>Renovables<br>kWh</th><th>Red<br>kWh</th><th>Sin cubrir<br>kWh</th>${x.generator?'<th>Grupo<br>h/día promedio</th><th>Combustible<br>'+fuelUnit(x)+'/mes</th>':''}</tr></thead><tbody>${a.rows.map(v=>`<tr><td>${v.month}</td><td>${fmt(v.energy)}</td><td>${fmt(v.generation)}</td><td>${fmt(v.gridEnergy)}</td><td>${fmt(v.missing,1)}</td>${x.generator?`<td>${fmt(v.genHours,1)}</td><td>${fmt(v.fuelTotal,1)}</td>`:''}</tr>`).join('')}</tbody></table></div>`)}<div class="two spaced"><section class="card"><h2>Presupuesto desglosado</h2><table><tbody>${r.items.filter(([,v])=>v>0).map(([k,v])=>`<tr><td>${k}</td><td>${usd(v)}</td></tr>`).join('')}<tr><th>Total</th><th>${usd(r.capex)}</th></tr></tbody></table><small class="spaced">Banco manual: precio redondeado a módulos completos. No incluye financiación ni impuestos separados.</small></section><section class="card"><h2>Lo que hay que revisar</h2>${r.warnings.map(w=>`<p class="notice warn">${esc(w)}</p>`).join('')}<p class="notice">Balance con días representativos y perfiles horarios sintéticos. No simula rachas de mal tiempo ni garantiza autonomía.</p></section></div>${block('Compará alternativas con tus mismos datos',`<p class="muted">Se recalculan banco y grupo. Si quitás el banco, el grupo pasa a suministro directo. Si quitás el grupo, también se quita su compra.</p><div class="actions"><button class="btn secondary" data-action="without-battery">Probar sin baterías</button><button class="btn secondary" data-action="without-gen">Probar sin grupo</button></div>`)}<details class="card spaced"><summary>Fuentes, supuestos y procedencia</summary><p>${esc(x.source)}</p><p>Ubicación: ${x.lat}, ${x.lon}. ${x.resource?'Consulta '+esc(x.resource.date)+' · '+esc(x.resource.period):'Sin consulta climática registrada.'}</p><p>Sombras: ${s.shade}%. Pérdidas globales: ${x.losses}%. Perfil de consumo: ${esc(x.habit)}. Parámetros marcados como estimados: ${Object.keys(x.unknown).filter(k=>x.unknown[k]).map(k=>esc(HELP[k]?.[0]||k)).join(', ')||'ninguno'}.</p><p>Si falta radiación difusa se asume 40% de la horizontal; albedo 0,20. No se usa IA ni se inventan fuentes. Los datos de ejemplo no son climáticos reales.</p>${x.emissions>0&&x.connection==='grid'?`<p>Emisiones de red evitadas estimadas: ${fmt(Math.max(0,r.base.grid-a.grid)*x.emissions)} kg CO₂/año. Factor ingresado: ${x.emissions} kg CO₂/kWh. No incluye emisiones del grupo ni fabricación.</p>`:''}</details><details class="card spaced"><summary>Flujo económico año a año</summary><p>${r.comparable?'USD constantes. Degradación solar recalculada en el balance de cada año.':'Flujos orientativos no comparables: no usar para concluir rentabilidad.'}</p><div class="scroll"><table><thead><tr><th>Año</th><th>Flujo neto USD</th><th>Reposiciones USD</th><th>Acumulado USD</th></tr></thead><tbody><tr><td>0</td><td>${fmt(-r.capex)}</td><td>—</td><td>${fmt(-r.capex)}</td></tr>${r.flows.map(v=>`<tr><td>${v.year}</td><td>${fmt(v.saving)}</td><td>${fmt(v.replacement)}</td><td>${fmt(v.cumulative)}</td></tr>`).join('')}</tbody></table></div></details><div class="actions spaced noprint"><button class="btn secondary" data-action="print">Imprimir / guardar PDF</button><button class="btn secondary" data-action="csv">Descargar tabla CSV</button></div>`}
function history(){let hs=store.history;return `<span class="eyebrow">Tu recorrido</span><h1>Ideas que quedan guardadas.</h1><p class="muted">Historial local de ${esc(store.profile)}. No se sincroniza entre dispositivos. Exportá un respaldo para trasladarlo.</p><div class="actions"><button class="btn" data-action="new">＋ Nueva simulación</button><button class="btn secondary" data-action="export">Exportar respaldo</button></div>${hs.length?`<div class="two spaced">${hs.map(r=>`<article class="card"><span class="badge">${esc(r.x.technology)} · ${new Date(r.date).toLocaleDateString('es-AR')}</span><h2 class="spaced">${esc(r.x.title)}</h2><p class="muted">${esc(r.x.house)} · ${esc(r.x.location||'Por coordenadas')}</p><div class="metric">${usd(r.capex)}</div><small>${fmt(r.a.generation)} kWh/año · ${fmt(r.a.missing)} kWh sin cubrir</small><div class="actions spaced"><button class="btn small" data-open="${esc(r.id)}">Ver resultado</button><button class="btn secondary small" data-compare="${esc(r.id)}">Comparar</button><button class="btn secondary small" data-delete="${esc(r.id)}">Eliminar</button></div></article>`).join('')}</div>`:'<div class="card empty spaced"><div class="icon">◷</div><h2>Tu primera idea empieza acá.</h2><p class="muted">Simulá y tocá “Guardar escenario” al ver el resultado.</p></div>'}<details class="card spaced"><summary>Viviendas guardadas (${store.houses.length})</summary><p>Al guardar un escenario se conserva una ficha de la vivienda. Cargarla crea un borrador nuevo.</p><div class="actions">${store.houses.map((h,i)=>`<button class="btn secondary small" data-house="${i}">${esc(h.house)}</button>`).join('')||'Todavía no guardaste viviendas.'}</div></details>`}
const builtins=[{name:'Solar mono · referencia 550 W',kind:'solar',power:550,area:2.6,price:140},{name:'Solar compacto · referencia 450 W',kind:'solar',power:450,area:2.1,price:120},{name:'Banco LFP · referencia 5,12 kWh',kind:'battery',power:5.12,price:1000},{name:'Eólica · referencia 1,5 kW',kind:'wind',power:1500,price:1500}];
function catalog(){return `<span class="eyebrow">Tu biblioteca técnica</span><h1>Equipos con números claros.</h1><p class="muted">Referencias didácticas sin marca ni cotización vigente. Agregá la ficha y el precio de tu proveedor.</p><button class="btn" data-action="new-equipment">＋ Agregar equipo</button><div class="grid spaced">${[...builtins,...store.catalog].map((e,i)=>`<article class="card"><div class="icon">${e.kind==='solar'?'☀':e.kind==='wind'?'≋':'ϟ'}</div><span class="badge">${e.kind==='solar'?'Panel':e.kind==='wind'?'Aerogenerador':'Batería'}</span><h3 class="spaced">${esc(e.name)}</h3><div class="metric">${fmt(e.power,2)} <small style="display:inline">${e.kind==='battery'?'kWh':'W'}</small></div>${e.kind==='solar'?`<small>${e.area} m² · eficiencia STC aproximada ${fmt(e.power/(e.area*1000)*100,1)}%</small>`:e.kind==='wind'?'<small>Curva genérica editable en modo técnico.</small>':'<small>Capacidad nominal; uso condicionado por DoD.</small>'}<p>${usd(e.price)} / unidad</p><button class="btn quiet small" data-equipment="${i}">Usar en mi borrador →</button>${i>=builtins.length?`<button class="btn secondary small" data-delete-equipment="${i-builtins.length}">Eliminar</button>`:''}</article>`).join('')}</div>`}
function learn(){return `<span class="eyebrow">Energía entendible</span><h1>Un poco de luz sobre el tema.</h1>${block('Del sol a tu casa',`<div class="flow">${[['☀','01 · Sol','La radiación llega al módulo.'],['▦','02 · Panel','Genera electricidad continua.'],['ϟ','03 · Inversor','Adapta la energía a tus consumos.'],['⌂','04 · Hogar','Usás, almacenás o gestionás el excedente.']].map(([ic,t,p])=>`<div><span style="font-size:28px">${ic}</span><b>${t}</b><small>${p}</small></div>`).join('')}</div>`)}<div class="two spaced"><article class="card"><h2>Potencia ≠ energía</h2><p>Un aparato de 1 kW durante 2 horas consume 2 kWh. El inversor y el grupo deben soportar potencia; paneles y baterías deben aportar energía.</p></article><article class="card"><h2>Generar no siempre es ahorrar</h2><p>La energía debe coincidir con tu consumo, guardarse o entregarse a una red habilitada. Un excedente no aprovechado no reduce tu factura.</p></article></div>${block('Qué hace este modelo',`<details open><summary>Solar: ubicación, inclinación y pérdidas</summary><p>NASA POWER: promedios mensuales de radiación horizontal (ALLSKY_SFC_SW_DWN), radiación difusa (ALLSKY_SFC_SW_DIFF) y viento a 10 m (WS10M). Si un parámetro falta, la consulta no se presenta como completa. La orientación se resuelve mediante geometría solar de un día representativo por mes, cielo difuso isotrópico y albedo 0,20. Sin difusa medida/modelada se asume 40% de GHI.</p><p>La energía se distribuye en 24 horas solares y se limita por potencia del inversor. Se aplican pérdidas y sombras una vez. No se modelan horizontes, nieve, temperaturas horarias ni sombras entre filas. Latitudes admitidas: ±60°.</p></details><details><summary>Baterías y generador</summary><p>Se repite 12 veces el día promedio de cada mes para aproximar un estado de carga periódico. La batería respeta capacidad utilizable, potencia y eficiencia de ciclo. El generador atiende la demanda faltante o carga, según la elección. No hay energía inicial gratuita. No se modelan secuencias de nubes, arranques ni tiempos mínimos de marcha.</p><p>La carga mensual promedio incluye ausencias: las horas de grupo no describen un día ocupado concreto. El banco sugerido usa consumo esencial × autonomía / (DoD × eficiencia de descarga), redondeado a módulos. No verifica corriente máxima, BMS, temperatura ni compatibilidad del inversor.</p></details><details><summary>Eólica</summary><p>Velocidad ajustada por altura con ley potencial. Distribución Rayleigh (Weibull k=2) integrada sobre una curva genérica cúbica entre arranque y nominal, con corte. Se usa densidad de referencia implícita en la curva; no hay corrección por altitud. La potencia media se reparte uniforme durante el día: simplificación fuerte que no evalúa calmas ni turbulencia. El entorno solo agrega advertencias, no corrige mágicamente el recurso.</p></details><details><summary>Dinero e historial</summary><p>USD constantes. Referencia sin renovables: red o grupo seleccionado. Ahorro neto: diferencia de energía comprada y combustible, menos mantenimiento. Reposición de batería e inversor según vida indicada; sin financiación, inflación, impuestos separados, valor residual o reposición de paneles/turbinas. La degradación solar se aplica año a año. VAN y recuperación se omiten si los escenarios no cubren la misma demanda.</p><p>Los perfiles son locales sin contraseña: no son cuentas autenticadas. El historial no se migra automáticamente desde la versión 1 ni se sincroniza. El respaldo JSON de esta versión se puede importar en otro navegador.</p></details>`)}${block('Fuentes para seguir aprendiendo',`<p><a href="https://power.larc.nasa.gov/docs/services/api/temporal/climatology/" target="_blank" rel="noopener">NASA POWER · recurso climático y API ↗</a></p><p><a href="https://open-meteo.com/en/docs/geocoding-api" target="_blank" rel="noopener">Open-Meteo / GeoNames · búsqueda de localidades ↗</a></p><p><a href="https://www.argentina.gob.ar/economia/energia/energia-electrica/renovables/estudios-y-publicaciones" target="_blank" rel="noopener">Secretaría de Energía · Guía del Recurso Solar ↗</a></p><p><a href="https://www.argentina.gob.ar/economia/energia/informacion-geografica-energia/mapas-irradiancia-solar" target="_blank" rel="noopener">Mapas de irradiación de Argentina ↗</a></p><p class="muted">La guía argentina es una referencia para carga manual. Esta edición no contiene una base extraída de sus tablas ni afirma usarla en consultas automáticas. No se usa IA: se consultan fuentes y se calculan supuestos explícitos.</p>`)}<section class="hero spaced"><div><span class="eyebrow">Brisa · By Los Vagos</span><h1>Tu próxima decisión<br>empieza con energía.</h1><p>Explorá escenarios solares, eólicos y de respaldo. Datos claros para conversar con tu instalador.</p><button class="btn lime noprint" data-action="print">Imprimir folleto ↗</button></div>${art}</section>`}
function profile(){return `<span class="eyebrow">Tu espacio local</span><h1>Mi perfil.</h1><div class="two spaced"><section class="card"><h2>¿Cómo te llamamos?</h2><form id="profileform"><div class="field"><label for="profilename">Nombre del perfil</label><input id="profilename" name="name" maxlength="80" value="${esc(store.profile)}" required></div><button class="btn spaced">Guardar nombre</button></form><p class="notice">Este nombre identifica el espacio de este navegador. No es una cuenta online ni tiene contraseña. Personas que usen este mismo navegador pueden acceder a sus datos.</p></section><section class="card"><h2>Tus datos, con vos.</h2><p class="muted">Descargá el respaldo y guardalo en un lugar seguro. Incluye historial, viviendas y catálogo.</p><div class="actions"><button class="btn secondary" data-action="export">Exportar respaldo</button><button class="btn secondary" data-action="import">Importar respaldo v2</button></div><input type="file" id="importfile" accept="application/json,.json" hidden><small class="spaced">Importar reemplaza el espacio local, después de confirmarlo. No borra el historial de Brisa v1, guardado con otra clave.</small></section></div>`}
function download(name,data,type){let blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function getJSON(url){const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),25000);try{let r=await fetch(url,{signal:ctrl.signal});if(!r.ok)throw Error('Respuesta '+r.status);return await r.json()}finally{clearTimeout(timer)}}
async function searchGeo(){if(d.location.trim().length<3)return toast('Escribí al menos tres letras de la localidad.');busy=true;render();try{const j=await getJSON('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(d.location)+'&count=8&language=es&format=json');geoResults=j.results||[];if(!geoResults.length)toast('Sin coincidencias. Probá una localidad cercana o ingresá coordenadas.')}catch{toast('No se pudo consultar. Podés ingresar latitud y longitud manualmente.')}finally{busy=false;render()}}
async function climate(){if(d.lat< -60||d.lat>60||d.lon< -180||d.lon>180)return toast('Revisá las coordenadas.');busy=true;render();let lat=d.lat,lon=d.lon;try{const j=await getJSON('https://power.larc.nasa.gov/api/temporal/climatology/point?parameters=ALLSKY_SFC_SW_DWN,ALLSKY_SFC_SW_DIFF,WS10M&community=RE&longitude='+lon+'&latitude='+lat+'&format=JSON');const p=j.properties?.parameter,keys=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];const read=k=>keys.map(m=>p?.[k]?.[m]);let g=read('ALLSKY_SFC_SW_DWN'),df=read('ALLSKY_SFC_SW_DIFF'),w=read('WS10M');if(g.some(v=>!Number.isFinite(v)||v<0||v>15)||df.some(v=>!Number.isFinite(v)||v<0||v>15)||w.some(v=>!Number.isFinite(v)||v<0||v>40))throw Error('Serie incompleta');d.ghi=g;d.diffuse=df;d.wind=w;d.measureHeight=10;d.resourceMode='nasa';d.resource={date:new Date().toISOString().slice(0,10),period:j.header?.range||(String(j.header?.start||'inicio no informado')+' – '+String(j.header?.end||'fin no informado')),lat,lon};d.source='NASA POWER · climatología modelada por coordenadas '+lat+', '+lon;toast('Recurso mensual cargado. Verificá la ubicación.')}catch{toast('No se pudo cargar NASA POWER. Conservamos los datos anteriores y su fuente; podés reintentar o ingresar datos documentados.')}finally{busy=false;render()}}
function equipmentDialog(){let dialog=$('#dialog');dialog.innerHTML=`<button class="theme dialogclose" onclick="this.closest('dialog').close()">✕</button><h2>Agregar ficha</h2><form id="eqform"><div class="formgrid"><div class="field full"><label>Nombre / modelo</label><input name="name" maxlength="100" required></div><div class="field"><label>Tipo</label><select name="kind"><option value="solar">Panel solar</option><option value="wind">Aerogenerador</option><option value="battery">Batería</option></select></div><div class="field"><label>W · Potencia / kWh · Batería</label><input name="power" type="number" step="any" min=".1" max="100000" required></div><div class="field"><label>m² · Área (solo panel)</label><input name="area" type="number" step="any" min=".1" max="100" value="2.6" required></div><div class="field"><label>USD · Precio unitario</label><input name="price" type="number" step="any" min="0" max="10000000" required></div></div><p class="muted">Para eólica, ajustá arranque, nominal y corte en el modo técnico. No se importa una curva certificada.</p><button class="btn">Guardar equipo</button></form>`;dialog.showModal()}
let comparisons=[];
function compare(id){comparisons.push(id);comparisons=[...new Set(comparisons)];if(comparisons.length<2)return toast('Ahora tocá “Comparar” en otro escenario.');let [a,b]=comparisons.slice(-2).map(id=>store.history.find(r=>r.id===id));comparisons=[];$('#dialog').innerHTML=`<button class="theme dialogclose" onclick="this.closest('dialog').close()">✕</button><h2>Dos ideas, lado a lado.</h2><div class="scroll"><table><tr><th>Indicador</th><th>${esc(a.x.title)}</th><th>${esc(b.x.title)}</th></tr>${[['Inversión',usd(a.capex),usd(b.capex)],['Generación kWh/año',fmt(a.a.generation),fmt(b.a.generation)],['Sin cubrir kWh/año',fmt(a.a.missing),fmt(b.a.missing)],['Banco nominal kWh',fmt(a.s.bank,2),fmt(b.s.bank,2)],['Ahorro neto USD/año',a.comparable?fmt(a.annualSaving):'No evaluable',b.comparable?fmt(b.annualSaving):'No evaluable']].map(row=>'<tr>'+row.map((v,i)=>`<${i?'td':'th'}>${v}</${i?'td':'th'}>`).join('')+'</tr>').join('')}</table></div><p class="notice">Compará escenarios con demanda, fuente y precios equivalentes. El menor costo no implica igual servicio.</p>`;$('#dialog').showModal()}
function markManualClimate(){d.resourceMode='manual';d.resource=null;d.diffuse=Array(12).fill(null);if(d.source.startsWith('NASA')||d.source.startsWith('Ejemplo'))d.source='Carga manual · completar fuente y período'}
function updateValue(t){let k=t.dataset.k;if(k){let val=t.type==='checkbox'?t.checked:t.type==='number'?(t.value===''?NaN:Number(t.value)):t.value;d[k]=val;if(d.unknown[k])delete d.unknown[k];if(k==='lat'||k==='lon'){if(d.resourceMode==='nasa'){d.resourceMode='manual';d.resource=null;d.source='Datos de ubicación anterior: recargar NASA POWER para estas coordenadas.';d.resourceMode='stale'}}if(k==='tariffARS'&&d.exchange>0){d.tariff=d.tariffARS/d.exchange;delete d.unknown.tariff;let el=$('#f-tariff');if(el)el.value=d.tariff;let out=$('#converted');if(out)out.textContent=usd(d.tariff)+' / kWh'}if(k==='exchange'&&d.exchange>0&&d.tariffARS>0)d.tariff=d.tariffARS/d.exchange;if(k==='battery'&&val==='none')d.genUse='direct';if(k==='genFuel'){d.unknown.fuelRate=true;toast('Revisá consumo y precio: cambió la unidad del combustible.')}if(k==='source'&&d.resourceMode==='demo')markManualClimate();}if(t.dataset.array){d[t.dataset.array][+t.dataset.index]=t.value===''?NaN:Number(t.value);if(t.dataset.array==='ghi')markManualClimate();if(t.dataset.array==='wind'&&d.resourceMode==='nasa')d.source=d.source.includes('viento editado')?d.source:d.source+' · viento editado manualmente'}if(t.dataset.month!==undefined)d.months[+t.dataset.month]=t.checked;if(t.dataset.app!==undefined)d.appliances[+t.dataset.app][t.dataset.prop]=t.type==='number'?Number(t.value):t.value;}
document.addEventListener('input',e=>updateValue(e.target));
document.addEventListener('change',e=>{let t=e.target;updateValue(t);if(t.dataset.k&&['role','connection','placement','ideal','shadeChoice','energyMode','monthlyCustom','technology','sizing','battery','generator','genFuel','terrain','exportEnabled','exchange'].includes(t.dataset.k))render();if(t.id==='importfile')importBackup(t.files[0])});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='wizard'){try{if(!d.months.some(Boolean))throw Error('Elegí al menos un mes de uso.');if(step<4){step++;render();window.scrollTo(0,0)}else{result=calculate(d);go('results')}}catch(err){$('#formerror').textContent=err.message}}if(e.target.id==='profileform'){store.profile=new FormData(e.target).get('name').trim()||'Mi hogar';persist();toast('Nombre actualizado.');render()}if(e.target.id==='eqform'){const f=new FormData(e.target);let item={name:f.get('name'),kind:f.get('kind'),power:Number(f.get('power')),area:Number(f.get('area')),price:Number(f.get('price'))};if(item.kind==='solar'&&item.power/(item.area*1000)>.4)return toast('Potencia y superficie incompatibles con un panel de referencia.');store.catalog.push(item);persist();$('#dialog').close();render()}});
document.addEventListener('click',e=>{let t=e.target.closest('button');if(!t)return;if(t.dataset.help)return help(t.dataset.help);if(t.dataset.route)return go(t.dataset.route);if(t.dataset.start){d=defaults();d.role=t.dataset.start;step=0;return go('simulate')}if(t.dataset.step!==undefined){let form=$('#wizard');if(form&&!form.reportValidity())return;step=+t.dataset.step;render();window.scrollTo(0,0);return}if(t.dataset.unknown){let k=t.dataset.unknown;d[k]=+t.dataset.value;d.unknown[k]=true;render();return}if(t.dataset.geo!==undefined){let g=geoResults[+t.dataset.geo];d.location=g.name+', '+(g.admin1||g.country);d.lat=g.latitude;d.lon=g.longitude;if(d.resourceMode==='nasa'){d.resourceMode='manual';d.resource=null;d.source='Ubicación modificada: recargar recurso.';d.resourceMode='stale'}geoResults=[];render();return}if(t.dataset.removeApp!==undefined){d.appliances.splice(+t.dataset.removeApp,1);render();return}if(t.dataset.equipment!==undefined){const eq=[...builtins,...store.catalog][+t.dataset.equipment];if(eq.kind==='solar'){d.panelPower=eq.power;d.panelArea=eq.area;d.panelPrice=eq.price;if(d.technology==='wind')d.technology='hybrid'}if(eq.kind==='wind'){d.turbinePower=eq.power;d.turbinePrice=eq.price;if(d.technology==='solar')d.technology='hybrid'}if(eq.kind==='battery'){d.batteryUnit=eq.power;d.batteryUnitPrice=eq.price;d.battery='recommend'}step=3;go('simulate');toast('Equipo aplicado al borrador.');return}if(t.dataset.deleteEquipment!==undefined){if(confirm('¿Eliminar esta ficha del catálogo?')){store.catalog.splice(+t.dataset.deleteEquipment,1);persist();render()}return}if(t.dataset.open){result=clone(store.history.find(r=>r.id===t.dataset.open));return go('results')}if(t.dataset.compare)return compare(t.dataset.compare);if(t.dataset.delete){if(confirm('¿Eliminar esta simulación?')){store.history=store.history.filter(r=>r.id!==t.dataset.delete);persist();render()}return}if(t.dataset.house!==undefined){d=clone(store.houses[+t.dataset.house]);d.title='Nuevo escenario · '+d.house;step=0;return go('simulate')}
const a=t.dataset.action;switch(a){case'new':d=defaults();step=0;go('simulate');break;case'back':if(step){step--;render();window.scrollTo(0,0)}else go('home');break;case'geolocate':if(!navigator.geolocation){toast('Tu navegador no ofrece ubicación. Ingresá coordenadas.');break}navigator.geolocation.getCurrentPosition(pos=>{d.lat=Number(pos.coords.latitude.toFixed(5));d.lon=Number(pos.coords.longitude.toFixed(5));if(d.resourceMode==='nasa'){d.resourceMode='stale';d.resource=null;d.source='Ubicación modificada: recargar recurso.'}d.location='Ubicación actual';render();toast('Coordenadas cargadas. Consultá el recurso para este punto.');},()=>toast('No se pudo obtener la ubicación. Ingresá coordenadas o buscá una localidad.'),{timeout:15000});break;case'suggest-gen':d.genPower=Math.ceil((d.peak+(d.battery!=='none'&&d.genUse==='both'?d.genCharge:0))/(d.genLoad/100)*2)/2;d.unknown.genPower=true;render();toast('Potencia orientativa. Confirmá arranques y consumo de combustible en la ficha.');break;case'search':searchGeo();break;case'climate':climate();break;case'add-app':d.appliances.push({name:'Nuevo artefacto',watts:100,qty:1,hours:1});render();break;case'edit':d=clone(result.x);step=0;go('simulate');break;case'save':if(!store.history.some(r=>r.id===result.id))store.history.unshift(clone(result));store.houses=store.houses.filter(h=>h.house!==result.x.house);store.houses.unshift(clone(result.x));if(persist())toast('Escenario y vivienda guardados.');break;case'without-battery':case'without-gen':{let x=clone(result.x);if(a==='without-battery'){x.battery='none';x.genUse='direct';x.title+=' · sin banco'}else{x.generator=false;x.costGen=0;x.title+=' · sin grupo'}try{result=calculate(x);go('results')}catch(e){toast(e.message)}break}case'print':window.print();break;case'export':download('brisa-respaldo-v2.json',JSON.stringify({version:VERSION,store},null,2),'application/json');break;case'import':$('#importfile').click();break;case'new-equipment':equipmentDialog();break;case'csv':{let rows=[['Mes','Consumo kWh','Generacion kWh','Red kWh','Sin cubrir kWh','Grupo h/dia','Combustible '+fuelUnit(result.x)],...result.a.rows.map(v=>[v.month,v.energy,v.generation,v.gridEnergy,v.missing,v.genHours,v.fuelTotal])];download('brisa-mensual.csv','\uFEFF'+rows.map(row=>row.map(v=>typeof v==='number'?v.toFixed(2).replace('.',','):v).join(';')).join('\n'),'text/csv;charset=utf-8');break}}
});
async function importBackup(file){if(!file)return;if(file.size>10000000)return toast('El respaldo supera 10 MB.');try{let j=JSON.parse(await file.text());if(j.version!==VERSION||!j.store||typeof j.store.profile!=='string'||!Array.isArray(j.store.history)||!Array.isArray(j.store.houses)||!Array.isArray(j.store.catalog))throw Error('Formato incorrecto');let safe={profile:j.store.profile.slice(0,80),history:[],houses:[],catalog:[]};if(j.store.history.length>200||j.store.houses.length>200||j.store.catalog.length>200)throw Error('Demasiados registros');for(const r of j.store.history){validate(r.x);let computed=calculate(r.x);computed.id=String(r.id);computed.date=Number.isNaN(Date.parse(r.date))?computed.date:r.date;safe.history.push(computed)}for(const h of j.store.houses){validate(h);safe.houses.push(h)}for(const eq of j.store.catalog){if(!['solar','wind','battery'].includes(eq.kind)||typeof eq.name!=='string'||!Number.isFinite(eq.power)||eq.power<=0||!Number.isFinite(eq.price)||eq.price<0||eq.kind==='solar'&&(!Number.isFinite(eq.area)||eq.area<=0))throw Error('Ficha inválida');safe.catalog.push(eq)}if(confirm('¿Reemplazar los datos locales por este respaldo? Exportá primero si querés conservarlos.')){try{localStorage.setItem(KEY,JSON.stringify(safe));store=safe;render();toast('Respaldo importado.')}catch{toast('No se pudo guardar. Tus datos anteriores siguen intactos.')}}}catch{toast('No se importó: respaldo v2 inválido o incompleto.')}}
function themeLabel(){let dark=document.body.classList.contains('dark');$('#theme').textContent=dark?'☀ Modo claro':'☾ Modo oscuro';$('#theme').setAttribute('aria-pressed',String(dark))}
try{if((localStorage.getItem('brisa-theme')|| (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))==='dark')document.body.classList.add('dark')}catch{}themeLabel();$('#theme').onclick=()=>{document.body.classList.toggle('dark');themeLabel();try{localStorage.setItem('brisa-theme',document.body.classList.contains('dark')?'dark':'light')}catch{}};window.addEventListener('hashchange',render);$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog')){const r=$('#dialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('#dialog').close()}});render();
</script></body></html>
